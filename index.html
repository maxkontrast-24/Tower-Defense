<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bollwerk">
<meta name="theme-color" content="#0d2142">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Bollwerk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: Vollbild-Spiel. Oben HUD, Mitte Spielbrett (Canvas), unten Bau-Panel. Menüs als eigene Bildschirme. Nachtwald mit Pergament und Gold – bewusst nur dunkel. */
:root{
  --bg:#0d2142; --panel:#1f4387; --panel2:#2a57a3; --panel3:#3a6cc0; --line:rgba(255,255,255,.16);
  --ink:#ffffff; --muted:#bcd0f2; --gold:#ffd23f; --gold2:#ffa51c; --red:#ff5d4d; --blue:#5cc8ff; --green:#5ee36f; --violet:#c7b3ff;
  --ol:#0b1a36;
  --tso:0 2px 0 var(--ol),0 -1px 0 var(--ol),1.5px 0 0 var(--ol),-1.5px 0 0 var(--ol),1px 1px 0 var(--ol),-1px 1px 0 var(--ol);
  --tso2:0 4px 0 var(--ol),0 -2px 0 var(--ol),2.5px 0 0 var(--ol),-2.5px 0 0 var(--ol),2px 2px 0 var(--ol),-2px 2px 0 var(--ol),2px -2px 0 var(--ol),-2px -2px 0 var(--ol),0 8px 18px rgba(0,0,0,.35);
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em}
.muted{color:var(--muted)} .gold{color:var(--gold)} .red{color:var(--red)} .green{color:var(--green)} .blue{color:var(--blue)}
.ins{padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px))}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;font-family:var(--display);font-size:18px;letter-spacing:.02em;
  background:var(--panel3);box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28)}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{background:linear-gradient(180deg,#ffd76a,#ffb22e);color:#3a2300;box-shadow:inset 0 -4px 0 #c9790f,inset 0 1px 0 rgba(255,255,255,.6)}
.btn.green{background:linear-gradient(180deg,#8be89a,#4cc463);color:#0d3014;box-shadow:inset 0 -4px 0 #2f8f45,inset 0 1px 0 rgba(255,255,255,.5)}
.btn.red{background:linear-gradient(180deg,#ff8676,#e8483a);color:#3a0904;box-shadow:inset 0 -4px 0 #a92c22,inset 0 1px 0 rgba(255,255,255,.4)}
.btn.wide{width:100%}
.btn.sm{min-height:38px;font-size:15px;padding:6px 12px;border-radius:11px}

/* Titel */
.title{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  background:radial-gradient(120% 60% at 50% 0%,#2c4a3a 0%,#132019 55%,#0c120f 100%)}
.title canvas{position:absolute;inset:0;width:100%;height:100%}
.title .top,.title .bot{position:relative;z-index:1;max-width:520px;width:100%;margin:0 auto;display:grid;gap:12px}
.logo{font-family:var(--display);font-size:clamp(58px,18vw,96px);line-height:.9;color:var(--gold);text-shadow:0 5px 0 #8a4b00,0 14px 30px rgba(0,0,0,.6);letter-spacing:.01em}
.tag{font-weight:800;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);opacity:.8}
.tstat{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid var(--line);font-weight:800;font-size:14px}
.chip svg{width:16px;height:16px}

/* Karte */
.map{position:fixed;inset:0;overflow-y:auto;background:var(--bg)}
.map .wrap{max-width:560px;margin:0 auto;display:grid;gap:16px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mhead h2{font-size:34px}
.icb{width:44px;height:44px;border-radius:13px;background:var(--panel2);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.icb svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.world{border-radius:22px;padding:16px;display:grid;gap:14px;position:relative;overflow:hidden;border:1px solid var(--line)}
.world h3{font-size:24px}
.world .sub{font-size:13px;font-weight:700;opacity:.8}







.world .wh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lvlist{display:grid;gap:8px}
.lvc{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px 8px 8px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);text-align:left;width:100%}
.lvc canvas{width:56px;height:87px;border-radius:9px;box-shadow:0 4px 12px rgba(0,0,0,.35);display:block}
.lvc .lvn{display:block;font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.lvc b{display:block;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1;margin:1px 0 2px}
.lvc .meta{display:block;font-size:12px;font-weight:700;opacity:.8;margin-bottom:4px}
.lvc .play{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#ffd76a,#ffb22e);box-shadow:inset 0 -3px 0 #c9790f,0 4px 10px rgba(0,0,0,.3)}
.lvc .play svg{width:18px;height:18px;fill:#3a2300}
.lvc.locked{opacity:.55}.lvc.locked canvas{filter:grayscale(1) brightness(.7)}
.lvc.locked .play{background:rgba(0,0,0,.3);box-shadow:none}.lvc.locked .play svg{fill:none;stroke:#c8d0c9;stroke-width:2.2}
.newtag{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:900;padding:3px 8px;border-radius:7px;background:rgba(255,201,74,.2);color:var(--gold)}
.stars{display:flex;gap:2px}
.stars svg{width:16px;height:16px}
.w-wiese{background:linear-gradient(160deg,#3f7a3a,#21402a)}
.w-wueste{background:linear-gradient(160deg,#b78a46,#5e4224)}
.w-frost{background:linear-gradient(160deg,#6d97b4,#2b4357)}
.w-vulkan{background:linear-gradient(160deg,#7a2f22,#2a1716)}
.w-endlos{background:linear-gradient(160deg,#4b3a7a,#1d1838)}

/* Spiel */
.game{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}





.hud{position:absolute;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);z-index:6;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 8px 10px;background:linear-gradient(180deg,rgba(11,26,54,.82) 0%,rgba(11,26,54,.5) 65%,rgba(11,26,54,0) 100%);pointer-events:none}
.hud>*{pointer-events:auto}
.res{display:flex;align-items:stretch;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.res>span{display:flex;align-items:center;gap:6px;padding:6px 10px;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums;line-height:1}
.res>span+span{border-left:1px solid var(--line)}
.res svg{width:18px;height:18px;flex:none}
.res .low{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(255,107,90,.25)}}
.wv{min-width:0;display:grid;gap:5px}
.wv .l{display:flex;justify-content:space-between;align-items:baseline;gap:6px;white-space:nowrap}
.wv .l b{font-family:var(--display);font-weight:400;font-size:16px}
.wv .l span{font-size:11.5px;font-weight:800;color:var(--muted);overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:420px){.wv .l span{display:none}}
.wbar{height:6px;border-radius:3px;background:var(--panel3);overflow:hidden}
.wbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6cc6ff,#b69cff);border-radius:3px}
.wbar i.cd{background:linear-gradient(90deg,#ffb22e,#ffd76a)}
.ctl{display:flex;gap:6px}
.hbtn{min-width:42px;height:40px;padding:0 10px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-family:var(--display);font-size:16px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28)}
.hbtn svg{width:18px;height:18px;fill:var(--ink)}
.hbtn.on{background:var(--gold);color:#3a2300}
#boardWrap{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.banner{position:absolute;left:50%;top:58px;transform:translateX(-50%);padding:8px 22px 9px;border-radius:14px;background:linear-gradient(180deg,rgba(32,46,38,.96),rgba(18,28,22,.96));border:1px solid rgba(255,201,74,.55);box-shadow:0 12px 30px rgba(0,0,0,.45);font-family:var(--display);font-size:26px;line-height:1.05;color:var(--gold);pointer-events:none;white-space:nowrap;text-align:center;opacity:0}
.banner small{display:block;font-family:var(--body);font-weight:800;font-size:12.5px;color:var(--ink);opacity:.85;margin-top:2px}
.banner.show{animation:ban 2.4s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-26px)}12%{opacity:1;transform:translate(-50%,0)}84%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-14px)}}
.bossbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(72%,300px);padding:7px 12px 9px;border-radius:12px;background:rgba(18,12,10,.88);border:1px solid rgba(255,107,90,.5);display:grid;gap:5px;pointer-events:none}
.bossbar b{font-family:var(--display);font-weight:400;font-size:14px;color:#ffb3a8;letter-spacing:.04em;text-align:center}
.bb{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}.bb i{display:block;height:100%;background:linear-gradient(90deg,#ff6b5a,#ffb22e);border-radius:4px}
.tip{position:absolute;left:12px;right:12px;top:56px;margin:0 auto;max-width:420px;padding:10px 14px;border-radius:14px;background:rgba(14,22,18,.92);border:1px solid rgba(255,201,74,.45);font-weight:800;font-size:14px;text-align:center;pointer-events:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}

/* Panel */
.dock{flex:none;height:calc(132px + env(safe-area-inset-bottom,0px));position:relative;z-index:7}
.panel{position:absolute;left:0;right:0;bottom:0;min-height:100%;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;align-content:start;box-shadow:0 -12px 30px rgba(0,0,0,.4)}
.panel .hint{display:none}
.prow{display:flex;gap:8px;align-items:stretch}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.spells{display:flex;gap:6px}
.next{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px;padding:4px 10px;border-radius:14px;background:var(--panel2);min-height:46px}
.next .lb{font-size:10.5px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;line-height:1.25}
.ens{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;align-items:center}
.ens::-webkit-scrollbar{display:none}
.ens>span{display:flex;align-items:center;gap:2px;font-family:var(--display);font-size:16px;flex:none}
.ens canvas{width:28px;height:28px}
.ens em{font-style:normal;font-family:var(--body);font-weight:900;font-size:9.5px;padding:2px 5px;border-radius:5px;margin-left:3px;background:rgba(182,156,255,.2);color:var(--violet);text-transform:uppercase;letter-spacing:.05em}
.ens em.boss{background:rgba(255,107,90,.22);color:#ffb3a8}
.prow .grow{flex:1}
.spell{position:relative;width:62px;min-height:58px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;gap:0;padding:4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28);overflow:hidden}
.spell svg{width:26px;height:26px}
.spell span{font-size:10.5px;font-weight:900}
.spell .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);pointer-events:none}
.spell.armed{background:var(--gold);color:#3a2300}
.spell:disabled{opacity:.45}
.wavebtn{flex:1;flex-direction:column;gap:0;line-height:1.05}
.wavebtn small{font-family:var(--body);font-weight:800;font-size:12px;opacity:.85}
.hint{font-size:13px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cards::-webkit-scrollbar{display:none}
.tc{flex:none;width:84px;display:grid;justify-items:center;gap:2px;padding:6px 4px 7px;border-radius:14px;background:var(--panel2);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28)}
.tc canvas{width:48px;height:48px}
.tc b{font-size:11.5px;font-weight:900;line-height:1.1;text-align:center}
.tc .cost{display:flex;align-items:center;gap:3px;font-family:var(--display);font-size:15px;color:var(--gold)}
.tc .cost svg{width:13px;height:13px}
.tc .role{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.02em}
.tc.poor .cost{color:var(--red)}
.tc.pick{background:var(--panel3);box-shadow:inset 0 0 0 2px var(--gold),inset 0 -3px 0 rgba(0,0,0,.28)}
.tc:disabled{opacity:.45}
.tc:disabled .cost{color:var(--red)}
.tc.lock{opacity:.35}
.ptop{display:flex;align-items:center;gap:10px}
.ptop canvas{width:52px;height:52px;flex:none}
.ptop .nm{font-family:var(--display);font-size:20px;line-height:1}
.ptop .sub{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.ptop>.grow{flex:1;min-width:0}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:16px;height:6px;border-radius:3px;background:var(--panel3)} .pips i.on{background:var(--gold)}
.x{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2.6;fill:none;stroke-linecap:round}
.sts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sts div{background:var(--panel2);border-radius:10px;padding:5px 8px;font-size:11px;font-weight:800;color:var(--muted)}
.sts b{display:block;font-family:var(--display);font-size:15px;color:var(--ink);font-weight:400}
.sts b em{font-style:normal;color:var(--green);font-size:13px}
.acts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px}
.acts .btn{font-size:15px;min-height:46px;padding:4px 6px;flex-direction:column;gap:0;line-height:1.05}
.acts .btn small{font-family:var(--body);font-weight:900;font-size:11.5px;display:flex;align-items:center;gap:3px}
.acts .btn small svg{width:12px;height:12px}

/* Overlay */
.ov{position:fixed;inset:0;z-index:30;background:rgba(6,14,30,.7);display:grid;place-items:center;padding:20px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.box{width:100%;max-width:380px;max-height:86vh;overflow-y:auto;background:linear-gradient(180deg,#24332b,#1b2620);border:1px solid var(--line);border-radius:24px;padding:22px 18px 18px;display:grid;gap:14px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.box h2{font-size:38px;color:var(--gold);text-shadow:0 3px 0 #6b3a00}
.box h2.lose{color:var(--red);text-shadow:0 3px 0 #5a120b}
.bigstars{display:flex;justify-content:center;gap:6px}
.bigstars svg{width:58px;height:58px;opacity:.25;transform:scale(.6)}
.bigstars svg.on{opacity:1;animation:star .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes star{from{transform:scale(.2) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.ostats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ostats div{background:rgba(0,0,0,.25);border-radius:12px;padding:8px 4px;font-size:11px;font-weight:800;color:var(--muted)}
.ostats b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);font-weight:400}
.unl{padding:10px 12px;border-radius:14px;border:1px dashed rgba(255,201,74,.6);background:rgba(255,201,74,.07);font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px;text-align:left}
.unl canvas{width:44px;height:44px;flex:none}
.col{display:grid;gap:8px}
.ars{text-align:left;display:grid;gap:8px}
.ars .it{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;padding:8px;border-radius:14px;background:rgba(0,0,0,.22)}
.ars canvas{width:48px;height:48px}
.ars b{font-family:var(--display);font-weight:400;font-size:17px}
.ars p{margin:2px 0 0;font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.35}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.25)}
.tabs2 button{min-height:36px;border-radius:10px;font-weight:900;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--panel3);color:var(--gold)}
/* ---------- Cartoon-Skin ---------- */
.btn{border:2.5px solid var(--ol);background:linear-gradient(180deg,#5b90e0,#2f5fb0);color:#fff;text-shadow:var(--tso);box-shadow:inset 0 -4px 0 #1c3f7e,inset 0 2px 0 rgba(255,255,255,.3)}
.btn.gold{background:linear-gradient(180deg,#ffe36b,#ffb21c);color:#4a2a00;text-shadow:0 1px 0 rgba(255,255,255,.55);box-shadow:inset 0 -4px 0 #d07a07,inset 0 2px 0 rgba(255,255,255,.6)}
.btn.green{background:linear-gradient(180deg,#86f394,#2ec24c);color:#fff;text-shadow:0 2px 0 #176b2a,0 -1px 0 #176b2a,1.5px 0 0 #176b2a,-1.5px 0 0 #176b2a;box-shadow:inset 0 -5px 0 #1d8a38,inset 0 2px 0 rgba(255,255,255,.55)}
.btn.red{background:linear-gradient(180deg,#ff8a7c,#e53e2e);color:#fff;text-shadow:0 2px 0 #8a1d14,0 -1px 0 #8a1d14,1.5px 0 0 #8a1d14,-1.5px 0 0 #8a1d14;box-shadow:inset 0 -4px 0 #a92a1e,inset 0 2px 0 rgba(255,255,255,.45)}
.btn:disabled{filter:grayscale(.6);opacity:.55}
.btn small{text-shadow:none;opacity:.95}
.btn.gold small{color:#5a3500}
.panel{background:linear-gradient(180deg,#2c5db3 0%,#1d4185 100%);border-top:3px solid var(--ol);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 -10px 30px rgba(0,0,0,.4)}
.res{background:rgba(11,26,54,.85);border:2.5px solid var(--ol);border-radius:16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.res>span{color:#fff;text-shadow:var(--tso)}
.res>span+span{border-left:2px solid rgba(255,255,255,.12)}
.hbtn{border:2.5px solid var(--ol);background:linear-gradient(180deg,#5b90e0,#2f5fb0);color:#fff;text-shadow:var(--tso);box-shadow:inset 0 -3px 0 #1c3f7e,inset 0 2px 0 rgba(255,255,255,.3)}
.hbtn svg{fill:#fff;filter:drop-shadow(0 1.5px 0 var(--ol))}

let AC=null;const lastS={};
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f1,f2,dur,type,vol,delay=0,noise){
  if(P.muted)return;const a=AC;if(!a)return;const t0=a.currentTime+delay;const g=a.createGain();
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);g.connect(a.destination);
  if(noise){const b=a.createBuffer(1,Math.max(1,a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=f1;s.connect(f).connect(g);s.start(t0);return}
  const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t0+dur);o.connect(g);o.start(t0);o.stop(t0+dur+.02)
}

  if(e.poi.length){const sp=e.poi.find(p=>p.spread);if(sp)for(const o of G.en)if(!o.dead&&o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<1.4&&o.poi.length<4){o.poi.push({d:sp.d,t:4,spread:1});G.pa.push({x:o.x,y:o.y,vx:0,vy:-.6,l:.5,m:.5,s:.08,c:'#9be35a',g:0})}}
}
function splash(x,y,r,dmg,kind,air,src,extra){let n=0;for(const e of G.en){if(e.dead||(e.air&&!air))continue;const d=Math.hypot(e.x-x,e.y-y);if(d<=r+e.def.r*.5){hurt(e,dmg*(d<r*.4?1:.7),kind,0,src);n++;if(extra)extra(e)}}return n}
function slowE(e,f,t){if(e.def.boss)f*=.5;if(f>=e.slow||e.slowT<.2){e.slow=f;e.slowT=t}}
function boom(x,y,s,src,air){splash(x,y,s.splash,s.dmg,'phys',air,src,e=>onHit(e,s,src));burst(x,y,'#ffb34a',16,2.4,.08);burst(x,y,'#5b5048',8,1.2,.1);ring(x,y,s.splash,'#ffd76a',.3);sfx('boom');
  G.pa.push({x,y,vx:0,vy:-.3,l:.8,m:.8,s:.25,c:'#9a928a',g:0,smoke:1});
  if(s.cluster)for(let i=0;i<4;i++){const a=i*TAU/4+R(-.4,.4),cx=x+Math.cos(a)*.7,cy=y+Math.sin(a)*.7;G.fx.push({k:'cluster',x:cx,y:cy,l:.18+i*.06,m:.18+i*.06,dmg:s.dmg*.35,src,air,s})}}

/* ---------- Ziele ---------- */
function canSee(e,s){return !(e.air&&!s.air)&&!(e.def.camo&&!s.det)}
function targets(t,s,n){
  const list=[];for(const e of G.en){if(e.dead||!canSee(e,s))continue;const d=Math.hypot(e.x-t.x,e.y-t.y);if(d>s.rng)continue;
    const rem=G.paths[e.p].total-e.d;let v;
    if(t.mode==='first')v=-rem;else if(t.mode==='last')v=rem;else if(t.mode==='strong')v=e.hp+e.sh;else v=-d;list.push([v,e])}
  list.sort((a,b)=>b[0]-a[0]);return list.slice(0,n).map(x=>x[1])
}
function critDmg(s){if(s.crit&&Math.random()<s.crit[0])return [s.dmg*s.crit[1],true];return [s.dmg,false]}
function fire(t,s,tg){
  const b=TW[t.k],e=tg[0];t.ang=Math.atan2(e.y-t.y,e.x-t.x);t.rec=1;
  const mx=t.x+Math.cos(t.ang)*.32,my=t.y-.06+Math.sin(t.ang)*.32;
  const each=fn=>{for(let i=0;i<s.multi;i++){const tt=tg[i%tg.length];fn(tt,i)}};
  switch(b.proj){
    case 'arrow':each((tt,i)=>{const [d,c]=critDmg(s);G.pr.push({k:'arrow',x:mx,y:my,e:tt,sp:10,dmg:d,crit:c,src:t,s,delay:i*.04})});sfx('arrow');break;
    case 'ice':G.pr.push({k:'ice',x:mx,y:my,e,sp:7,dmg:s.dmg,src:t,s});sfx('ice');break;
    case 'glob':G.pr.push({k:'glob',x:mx,y:my,e,sp:5,dmg:s.dmg,src:t,s,t0:0});sfx('glob');break;
    case 'missile':each(tt=>G.pr.push({k:'missile',x:mx,y:my,e:tt,sp:3,acc:9,ang:t.ang+R(-1,1),dmg:s.dmg,src:t,s,smoke:0}));sfx('missile');break;
    case 'ball':each((tt,i)=>{const dur=Math.hypot(tt.x-t.x,tt.y-t.y)/6+.15+i*.05;const fp=pointAt(G.paths[tt.p],tt.d+tt.def.sp*G.D.sp*(1-tt.slow)*dur*.95);
      G.pr.push({k:'ball',sx:mx,sy:my,tx:fp.x,ty:fp.y,x:mx,y:my,t:0,dur,dmg:s.dmg,src:t,s,air:s.air&&tt.air,ay:tt.air?.42:0})});sfx('ball');break;
    case 'zap':{let cur=e;const hit=new Set();const pts=[{x:t.x,y:t.y-.3}];let dmg=s.dmg;
      for(let i=0;i<s.chain&&cur;i++){hit.add(cur);pts.push({x:cur.x,y:cur.y-(cur.air?.42:0)});hurt(cur,dmg,'magic',0,t);onHit(cur,s,t);dmg*=.85;
        let nx=null,nd=1.7;for(const o of G.en){if(o.dead||hit.has(o)||!canSee(o,s))continue;const d=Math.hypot(o.x-cur.x,o.y-cur.y);if(d<nd){nd=d;nx=o}}cur=nx}
      G.fx.push({k:'bolt',pts,l:.18,m:.18});sfx('zap');break}
    case 'shot':{const [d,c]=critDmg(s);hurt(e,d,'phys',s.pierce,t);onHit(e,s,t);if(c){txt(e.x,e.y-.7,'KRIT!','#ff8a7c',.8);sfx('crit')}
      G.fx.push({k:'tracer',x1:mx,y1:my,x2:e.x,y2:e.y-(e.air?.42:0),l:.14,m:.14});burst(e.x,e.y-(e.air?.42:0),'#fff3c4',6,1.4,.05);burst(mx,my,'#fff3b0',5,1.6,.05);sfx('shot');break}
    case 'flame':{let any=false;for(const o of G.en){if(o.dead||!canSee(o,s))continue;if(Math.hypot(o.x-t.x,o.y-t.y)<=s.rng){any=true;hurt(o,s.dmg,'magic',0,t);o.burn=Math.max(o.burn,s.burn);o.burnT=2;onHit(o,s,t)}}
      if(any){for(let i=0;i<5;i++){const a=t.ang+R(-.45,.45),v=R(1.6,3.2)*s.rng/1.7;G.pa.push({x:mx,y:my,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(.25,.45),m:.45,s:R(.08,.14),c:pick(['#ffb02e','#ff7a1c','#ffd76a']),g:0,fl:1})}sfx('flame')}
      break}
  }
}
function heroFire(h,s,tg){
  const e=tg[0];h.ang=Math.atan2(e.y-h.y,e.x-h.x);h.rec=1;
  if(h.k==='ada'){for(const tt of tg.slice(0,s.cleave)){hurt(tt,s.dmg,'phys',0,h);burst(tt.x,tt.y-(tt.air?.42:0),'#fff',4,1.2,.05)}h.swing=.22;sfx('sword')}
  else if(h.k==='orin'){G.pr.push({k:'fire',x:h.x,y:h.y-.5,e,sp:6,dmg:s.dmg,src:h,s});sfx('fire')}
  else{for(let i=0;i<s.multi;i++){const tt=tg[i%tg.length];G.pr.push({k:'arrow',x:h.x,y:h.y-.4,e:tt,sp:12,dmg:s.dmg,src:h,s,gold:1,delay:i*.04})}sfx('arrow')}
}
function heroAbility(){
  const h=G.hero;if(!h||h.lvl<3||G.scd.hero>0)return;const H=HERO[h.k],l=h.lvl;G.scd.hero=H.ab.cd;sfx('ability');
  if(h.k==='ada'){const dmg=60+28*l;for(const e of G.en){if(e.dead)continue;if(Math.hypot(e.x-h.x,e.y-h.y)<=2.3){hurt(e,dmg,'phys',0,h);if(!e.def.boss)e.stun=Math.max(e.stun,1.1)}}
    ring(h.x,h.y,2.3,'#ffd23f',.6);ring(h.x,h.y,1.6,'#ffffff',.45);burst(h.x,h.y,'#ffe680',40,3.2);h.swing=.6;G.shake=.35}
  else if(h.k==='orin'){const tg=G.en.filter(e=>!e.dead).sort((a,b)=>(b.hp+b.sh)-(a.hp+a.sh)).slice(0,5);
    tg.forEach((e,i)=>G.fx.push({k:'meteor',x:e.x,y:e.y,l:.9+i*.12,m:.9+i*.12,hero:1,dmg:45+22*l}))}
  else{const dmg=20+11*l;for(const e of G.en){if(e.dead||Math.hypot(e.x-h.x,e.y-h.y)>5)continue;for(let i=0;i<3;i++)G.pr.push({k:'arrow',x:h.x+R(-.3,.3),y:h.y-.4,e,sp:11+i,dmg,src:h,s:{},gold:1,delay:i*.06})}
    ring(h.x,h.y,5,'#7be08a',.5)}
  renderPanel()
}

/* =================== Update =================== */
function update(dt){
  if(!G||G.over)return;G.t+=dt;
  for(const k in G.scd)G.scd[k]=Math.max(0,G.scd[k]-dt);
  if(G.spawning){G.qt+=dt;while(G.q.length&&G.q[0].at<=G.qt){const q=G.q.shift();spawn(q.t,0,null,q.hpm)}if(!G.q.length){G.spawning=false;if(G.endless||G.wave<G.total)G.cd=20;renderPanel()}}
  else if(G.cd>0){G.cd-=dt;if(G.cd<=0){G.cd=0;callWave()}}
  // Gegner
  for(const e of G.en){if(e.dead)continue;
    e.hit=Math.max(0,e.hit-dt);e.kb=Math.max(0,e.kb-dt);if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slow=0}if(e.frz>0)e.frz-=dt;if(e.stun>0)e.stun-=dt;
    if(e.burnT>0){e.burnT-=dt;hurt(e,e.burn*dt,'magic');if(Math.random()<dt*10)G.pa.push({x:e.x+R(-.1,.1),y:e.y-.1,vx:R(-.1,.1),vy:-R(.4,.9),l:.35,m:.35,s:.06,c:'#ff9a2e',g:0,fl:1})}
    if(e.poi.length){let dps=0;e.poi=e.poi.filter(p=>(p.t-=dt)>0);for(const p of e.poi)dps+=p.d;if(dps)hurt(e,dps*dt,'true');if(Math.random()<dt*6)G.pa.push({x:e.x+R(-.12,.12),y:e.y-.1,vx:0,vy:-.5,l:.4,m:.4,s:.05,c:'#9be35a',g:0})}
    if(e.dead)continue;
    if(e.def.regen&&e.hp<e.max){e.hp=Math.min(e.max,e.hp+e.max*e.def.regen*dt);if(Math.random()<dt*3)G.pa.push({x:e.x,y:e.y-.25,vx:0,vy:-.6,l:.5,m:.5,s:.07,c:'#ff9ac8',g:0,plus:1})}
    if(e.def.heal&&Math.random()<dt*2){let healed=false;for(const o of G.en)if(!o.dead&&o!==e&&!o.def.boss&&o.hp<o.max&&Math.hypot(o.x-e.x,o.y-e.y)<1.3){o.hp=Math.min(o.max,o.hp+o.max*e.def.heal);healed=true;G.pa.push({x:o.x,y:o.y-.2,vx:0,vy:-.6,l:.5,m:.5,s:.07,c:'#7be08a',g:0,plus:1})}if(healed)ring(e.x,e.y,1.3,'#4fd18b',.5)}
    if(e.def.spawner){e.sp2-=dt;if(e.sp2<=0){e.sp2=3.2;for(let i=0;i<2;i++)spawn('run',Math.max(0,e.d-.3-i*.3),e.p,.8);ring(e.x,e.y,1.2,'#8fb0ff',.5)}}
    const sp=e.def.sp*G.D.sp*(1-e.slow)*(e.frz>0||e.stun>0?0:1);e.d+=sp*dt;
    const p=G.paths[e.p];if(e.d>=p.total){e.dead=true;G.lives-=e.def.lv;G.leaks++;G.red=.5;G.shake=Math.max(G.shake,.25);sfx('leak');if(G.lives<=0){G.lives=0;endGame(false);return}continue}
    const pt=pointAt(p,e.d);e.x=pt.x;e.y=pt.y;e.ang=pt.ang}
  G.en=G.en.filter(e=>!e.dead);
  // Türme
  for(const t of G.tw){t.pop=Math.max(0,t.pop-dt);if(t.k==='mine')continue;const s=st(t);t.rec=Math.max(0,t.rec-dt*5);t.cd-=dt;
    if(s.aura){for(const e of G.en)if(!e.dead&&canSee(e,s)&&Math.hypot(e.x-t.x,e.y-t.y)<=s.rng)slowE(e,s.slow*.75,.3)}
    if(t.cd<=0){const tg=targets(t,s,Math.max(s.multi,1));if(tg.length){fire(t,s,tg);t.cd=1/s.rate}else t.cd=.05}
    else if(TW[t.k].proj!=='flame'){const tg=targets(t,s,1);if(tg.length){const a=Math.atan2(tg[0].y-t.y,tg[0].x-t.x);let da=((a-t.ang+Math.PI*3)%TAU)-Math.PI;t.ang+=da*Math.min(1,dt*10)}}}
  const h=G.hero;if(h){h.pop=Math.max(0,h.pop-dt);h.rec=Math.max(0,h.rec-dt*4);h.swing=Math.max(0,h.swing-dt);h.cd-=dt;const s=hst(h);
    if(h.cd<=0){const tg=targets(h,s,Math.max(3,s.multi));if(tg.length){heroFire(h,s,tg);h.cd=1/s.rate}else h.cd=.05}}
  // Geschosse
  for(const b of G.pr){
    if(b.delay>0){b.delay-=dt;continue}
    if(b.k==='ball'){b.t+=dt/b.dur;b.x=b.sx+(b.tx-b.sx)*b.t;b.y=b.sy+(b.ty-b.sy)*b.t;if(b.t>=1){b.done=true;boom(b.tx,b.ty,b.s,b.src,b.air)}continue}
    const e=b.e;let tx=b.tx,ty=b.ty;if(e&&!e.dead){tx=b.tx=e.x;ty=b.ty=e.y-(e.air?.42:0)}else if(tx===undefined){b.done=true;continue}
    if(b.k==='missile'){b.sp=Math.min(9,b.sp+b.acc*dt);const a=Math.atan2(ty-b.y,tx-b.x);let da=((a-b.ang+Math.PI*3)%TAU)-Math.PI;b.ang+=da*Math.min(1,dt*7);
      b.x+=Math.cos(b.ang)*b.sp*dt;b.y+=Math.sin(b.ang)*b.sp*dt;b.smoke-=dt;if(b.smoke<=0){b.smoke=.03;G.pa.push({x:b.x,y:b.y,vx:R(-.1,.1),vy:R(-.1,.1),l:.5,m:.5,s:.07,c:'#cfc8c0',g:0,smoke:1})}
      if(Math.hypot(tx-b.x,ty-b.y)<.18){b.done=true;boom(tx,ty+(e&&e.air?.42:0),b.s,b.src,true);G.shake=Math.max(G.shake,.08)}continue}
    const dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy),mv=b.sp*dt;
    if(b.k==='glob')b.t0+=dt;
    if(d<=mv+.05){b.done=true;
      if(b.k==='arrow'){if(e&&!e.dead){hurt(e,b.dmg,'phys',0,b.src);onHit(e,b.s,b.src);if(b.crit){txt(e.x,e.y-.7,'KRIT!','#ff8a7c',.8);sfx('crit')}}burst(tx,ty,'#e9d3a6',3,.8,.04)}
      if(b.k==='ice'){splash(tx,ty+(e&&e.air?.42:0),b.s.splash,b.dmg,'magic',true,b.src,o=>{if(canSee(o,b.s)){slowE(o,b.s.slow,1.8);onHit(o,b.s,b.src)}});burst(tx,ty,'#c8f0ff',10,1.4,.06);ring(tx,ty,b.s.splash,'#9fe0ff',.3)}
      if(b.k==='glob'){const addP=o=>{if(o.poi.length<4)o.poi.push({d:b.s.poison,t:4,spread:b.s.spread});else o.poi.sort((a,c)=>a.t-c.t)[0].t=4;onHit(o,b.s,b.src)};
        if(b.s.splash){splash(tx,ty+(e&&e.air?.42:0),b.s.splash,b.dmg,'true',b.s.air,b.src,addP);G.pa.push({x:tx,y:ty,vx:0,vy:0,l:.7,m:.7,s:b.s.splash*.6,c:'#8be34b',g:0,smoke:1})}
        else if(e&&!e.dead){hurt(e,b.dmg,'true',0,b.src);addP(e)}burst(tx,ty,'#8bd64b',8,1.2,.06)}
      if(b.k==='fire'){splash(tx,ty+(e&&e.air?.42:0),b.s.splash,b.dmg,'magic',true,b.src);burst(tx,ty,'#ff8a3a',14,2.2,.08);ring(tx,ty,b.s.splash,'#ffb34a',.3);sfx('boom')}
    }else{b.x+=dx/d*mv;b.y+=dy/d*mv;b.ang=Math.atan2(dy,dx)}
  }
  G.pr=G.pr.filter(b=>!b.done);
  // Partikel & Effekte
  for(const p of G.pa){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=.96;p.vy*=.96;p.l-=dt}
  G.pa=G.pa.filter(p=>p.l>0);if(G.pa.length>600)G.pa.splice(0,G.pa.length-600);
  for(const f of G.fx){f.l-=dt;if(f.k==='txt')f.y-=dt*.6;if(f.k==='coin')f.t+=dt*1.6;
    if(f.k==='meteor'&&!f.hit&&f.l<=.4){f.hit=true;f.hero?heroMeteorHit(f):meteorHit(f)}
    if(f.k==='cluster'&&!f.hit&&f.l<=.06){f.hit=true;splash(f.x,f.y,.6,f.dmg,'phys',f.air,f.src,e=>onHit(e,f.s,f.src));burst(f.x,f.y,'#ffb34a',8,1.6,.07);ring(f.x,f.y,.6,'#ffd76a',.25)}}
  for(const f of G.fx)if(f.k==='coin'&&f.t>=1){f.l=0;G.coins=Math.max(0,G.coins-1)}
  G.fx=G.fx.filter(f=>f.l>0);
  G.shake=Math.max(0,G.shake-dt);G.red=Math.max(0,G.red-dt);if(G.dark)G.dark=Math.max(0,G.dark-dt*.8);
  if(!G.spawning&&!G.en.length&&G.savedWave!==G.wave&&!G.over){G.savedWave=G.wave;if(!(!G.endless&&G.wave>=G.total))saveRun()}
  if(!G.endless&&G.wave>=G.total&&!G.spawning&&!G.q.length&&!G.en.length&&!G.over)endGame(true);
}

/* ---------- Zauber ---------- */
const spellOk=k=>G&&(G.endless||SPELL[k].u<=G.li);
function castMeteor(x,y){G.scd.meteor=SPELL.meteor.cd;G.spell=null;G.fx.push({k:'meteor',x,y,l:.9,m:.9});sfx('meteor');renderPanel()}
function meteorHit(f){const li=G.endless?11+G.wave/10:G.li;splash(f.x,f.y,1.5,140*(1+.3*Math.min(li,17))*(1+.06*G.wave),'magic',true,null);burst(f.x,f.y,'#ff8a3a',40,3.5,.1);burst(f.x,f.y,'#ffd76a',20,2,.07);ring(f.x,f.y,1.5,'#ffb34a',.5);G.shake=.4}
function heroMeteorHit(f){splash(f.x,f.y,1.1,f.dmg,'magic',true,G.hero);burst(f.x,f.y,'#b48cff',26,2.8,.09);ring(f.x,f.y,1.1,'#c9b2ff',.45);G.shake=Math.max(G.shake,.2);sfx('boom')}
function castNova(){G.scd.nova=SPELL.nova.cd;for(const e of G.en){e.frz=e.def.boss?1.2:2.6;hurt(e,25*(1+.15*Math.min(G.li,17)),'magic')}G.fx.push({k:'ring',x:COLS/2,y:ROWS/2,r:9,c:'#bfeaff',l:.6,m:.6});sfx('nova');renderPanel()}

function endGame(win){
  if(G.over)return;G.over=true;G.sel=null;G.spot=null;G.prev=null;clearRun();
  let stars=0,newBest=false;
  if(G.endless){const w=G.wave-(win?0:1);if(w>P.best){P.best=w;newBest=true}saveP()}
  else if(win){const f=G.lives/G.maxLives;stars=f>=1?3:f>=.5?2:1;const r=P.res[G.li]||(P.res[G.li]={});if(stars>(r[G.diff]||0))r[G.diff]=stars;saveP()}
  sfx(win?'win':'lose');if(win&&!G.endless)confetti();musicDuck(true);
  setTimeout(()=>showResult(win,stars,newBest),win?700:900)
}

/* =================== Zeichnen =================== */
/* Hoch-/Querformat: der ganze Zustand wird an der Diagonale gespiegelt, Figuren bleiben aufrecht */
function transpose(){
  const sw=(o,a='x',b='y')=>{if(o&&o[a]!==undefined){const t=o[a];o[a]=o[b];o[b]=t}};
  const ra=a=>Math.PI/2-a;
  const oc=COLS,orow=ROWS;G.land=!G.land;COLS=orow;ROWS=oc;
  G.paths=buildPaths(G.L);
  for(const t of G.tw){sw(t);t.ang=ra(t.ang)}
  if(G.hero){sw(G.hero);G.hero.ang=ra(G.hero.ang)}
  for(const d of G.deco)sw(d);
  for(const e of G.en){const pt=pointAt(G.paths[e.p],e.d);e.x=pt.x;e.y=pt.y;e.ang=pt.ang}
  for(const b of G.pr){sw(b);sw(b,'tx','ty');sw(b,'sx','sy');if(b.ang!==undefined)b.ang=ra(b.ang)}
  for(const q of G.pa){sw(q);sw(q,'vx','vy')}
  for(const f of G.fx){sw(f);sw(f,'x1','y1');sw(f,'x2','y2');sw(f,'sx','sy');if(f.pts)for(const q of f.pts)sw(q)}
  sw(G.spot);
}

let arsTab='tw';

  else if(arsTab==='en')items=Object.keys(EN).map(k=>{const e=EN[k];return `<div class="it">${iconCanvas(k,48,'en')}<div><b>${e.n}</b><p>${e.d}</p></div></div>`}).join('');
  else items=HKEYS.map(k=>{const H=HERO[k];return `<div class="it">${iconCanvas(k,48,'he')}<div><b>${H.n}</b> <span class="muted" style="font-weight:800;font-size:13px">${H.t}</span><p>${H.d}</p><p class="pth"><span>${H.ab.n}:</span> ${H.ab.d} (ab Stufe 3)${H.u?`<br>Verfügbar nach Level ${H.u}.`:''}</p></div></div>`}).join('');

  $('#ov').hidden=false;paintIcons(box)
}
function showPause(){G.paused=true;musicDuck(true);$('#box').innerHTML=`<h2>Pause</h2><p class="muted" style="margin:0;font-weight:700">${G.L.n} · ${G.D.n} · Welle ${G.wave}${G.endless?'':'/'+G.total}</p>
  <div class="col"><button class="btn gold wide" data-a="resume">Weiter</button><button class="btn wide" data-a="restart">Neu starten</button>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" data-a="mute">Ton: ${P.muted?'aus':'an'}</button><button class="btn" data-a="music">Musik: ${P.music?'an':'aus'}</button></div>
  <button class="btn wide" data-a="toMap">Zur Karte</button><p class="muted" style="margin:0;font-size:12px;font-weight:700">Dein Fortschritt wird nach jeder Welle gespeichert.</p></div>`;$('#ov').hidden=false}
function showResult(win,stars,newBest){
  if(!G)return;const box=$('#box');const li=G.li;
  const nextNew=!G.endless&&win&&li<EI-1?TKEYS.find(k=>TW[k].u===li+1):null;const spellNew=!G.endless&&win?Object.keys(SPELL).find(k=>SPELL[k].u===li+1):null;
  const heroNew=!G.endless&&win?HKEYS.find(k=>HERO[k].u===li+1):null;
  const stats=`<div class="ostats"><div>Leben<b>${G.lives}</b></div><div>Besiegt<b>${G.kills}</b></div><div>Welle<b>${G.wave}</b></div></div>`;
  if(G.endless){box.innerHTML=`<h2 class="${win?'':'lose'}">Gefallen in Welle ${G.wave}</h2>${newBest?'<div class="unl" style="justify-content:center">Neuer Rekord!</div>':`<p class="muted" style="margin:0;font-weight:700">Rekord: Welle ${P.best}</p>`}${stats}
    <div class="col"><button class="btn gold wide" data-a="restart">Nochmal</button><button class="btn wide" data-a="toMap">Zur Karte</button></div>`}
  else if(win){const full=G.maxLives;box.innerHTML=`<h2>Sieg!</h2><div class="bigstars">${[0,1,2].map(i=>SV.star.replace('<svg',`<svg class="${i<stars?'on':''}" style="animation-delay:${.15+i*.25}s"`)).join('')}</div>
    <p class="muted" style="margin:0;font-weight:700">${G.D.n} · ${stars===3?'Perfekt verteidigt!':stars===2?'Stark! Für 3 Sterne darfst du kein Leben verlieren.':`Geschafft! Mit ${Math.ceil(full/2)}+ Leben gibt es 2 Sterne.`}</p>${stats}
    ${nextNew?`<div class="unl">${iconCanvas(nextNew,44)}<span>Neu freigeschaltet: <span class="gold">${TW[nextNew].n}</span><br><span class="muted" style="font-size:12px">${TW[nextNew].d}</span></span></div>`:''}
    ${spellNew?`<div class="unl">${SV[spellNew].replace('<svg','<svg style="width:40px;height:40px;flex:none"')}<span>Neuer Zauber: <span class="gold">${SPELL[spellNew].n}</span><br><span class="muted" style="font-size:12px">${SPELL[spellNew].d}</span></span></div>`:''}
    ${heroNew?`<div class="unl">${iconCanvas(heroNew,44,'he')}<span>Neuer Held: <span class="gold">${HERO[heroNew].n}, ${HERO[heroNew].t}</span><br><span class="muted" style="font-size:12px">${HERO[heroNew].d}</span></span></div>`:''}
    <div class="col">${li<EI-1?`<button class="btn gold wide" data-a="next">Nächstes Level</button>`:'<div class="unl" style="justify-content:center">Du hast den Feldzug gewonnen! Versuch dich an „Schwer“.</div>'}<button class="btn wide" data-a="restart">Nochmal</button><button class="btn wide" data-a="toMap">Zur Karte</button></div>`}
  else{box.innerHTML=`<h2 class="lose">Niederlage</h2><p class="muted" style="margin:0;font-weight:700">Die Feste ist in Welle ${G.wave} gefallen. Tipp: ${pick(['Baue Türme an Kurven, dort sind Gegner länger in Reichweite.','Frost verlangsamt Gegner und macht alle anderen Türme stärker.','Ein Turm mit Pfad-3-Upgrade ist oft stärker als drei schwache Türme.','Gegen Panzerkäfer helfen Blitz, Gift und der Scharfschütze.','Getarnte Schleicher sehen nur Türme mit Radar, etwa der Scharfschütze.','Dein Held wird mit jeder Welle stärker – setze ihn früh.'])}</p>${stats}
    <div class="col"><button class="btn gold wide" data-a="restart">Nochmal</button><button class="btn wide" data-a="toMap">Zur Karte</button></div>`}
  $('#ov').hidden=false;paintIcons(box)
}

/* ---------- Konfetti ---------- */
const fxc=$('#fxc'),fctx=fxc.getContext('2d');let conf=[],confOn=false;
function confetti(){const w=innerWidth,h=innerHeight;
  for(let i=0;i<150;i++)conf.push({x:w/2+R(-w*.3,w*.3),y:h*.4+R(-40,40),vx:R(-280,280),vy:R(-700,-200),r:R(0,6),vr:R(-10,10),s:R(6,11),c:pick(['#ffd23f','#ff6b5a','#5ee36f','#5cc8ff','#c7b3ff','#ffffff']),l:R(2.4,3.6)});
  if(confOn)return;confOn=true;let lt=performance.now();
  const step=now=>{const dt=Math.min(.05,(now-lt)/1000);lt=now;const dpr=Math.min(2,devicePixelRatio||1),W2=Math.round(innerWidth*dpr),H2=Math.round(innerHeight*dpr);if(fxc.width!==W2||fxc.height!==H2){fxc.width=W2;fxc.height=H2}
    fctx.setTransform(dpr,0,0,dpr,0,0);fctx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of conf){p.vy+=650*dt;p.vx*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.l-=dt;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.globalAlpha=clamp(p.l,0,1);fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s*.3,p.s,p.s*.6);fctx.restore()}
    conf=conf.filter(p=>p.l>0&&p.y<innerHeight+40);if(conf.length)requestAnimationFrame(step);else{confOn=false;fctx.clearRect(0,0,innerWidth,innerHeight)}};
  requestAnimationFrame(step)}

/* ---------- Klicks ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;ac();const a=b.dataset.a;
  if(P.music&&!mus.on&&a!=='music')musicStart(G?G.L.b:'menu');
  switch(a){
    case 'toMap':$('#ov').hidden=true;showScreen('map');sfx('tap');break;
    case 'toTitle':showScreen('title');break;
    case 'play':showSheet(+b.dataset.i);sfx('tap');break;
    case 'diff':P.diff=b.dataset.v;saveP();showSheet(sheetI);sfx('tap');break;
    case 'hero':P.hero=b.dataset.v;saveP();showSheet(sheetI);sfx('tap');break;
    case 'go':$('#ov').hidden=true;clearRun();startLevel(sheetI,P.diff,P.hero);sfx('tap');break;
    case 'next':{const li=G.li+1,d=G.diff,hk=heroOk(G.heroK)?G.heroK:'ada';$('#ov').hidden=true;clearRun();startLevel(li,d,hk);break}
    case 'continue':{const r=loadRun();if(r){$('#ov').hidden=true;startLevel(r.li,r.diff,heroOk(r.hero)?r.hero:'ada',r)}break}
    case 'arsenal':showArsenal();break;
    case 'arsTab':arsTab=b.dataset.v;showArsenal();break;
    case 'closeOv':$('#ov').hidden=true;break;
    case 'mute':P.muted=!P.muted;saveP();if(G&&G.paused)showPause();else renderTitle();break;
    case 'music':P.music=!P.music;saveP();if(P.music){musicStart(G?G.L.b:'menu');if(G&&G.paused)musicDuck(true)}else musicStop();if(G&&G.paused)showPause();else renderTitle();break;
    case 'speed':G.speed=G.speed%3+1;renderHud();break;
    case 'pause':showPause();break;
    case 'resume':G.paused=false;$('#ov').hidden=true;musicDuck(false);break;
    case 'restart':{$('#ov').hidden=true;clearRun();const li=G?G.li:0,d=G?G.diff:P.diff,hk=G?G.heroK:P.hero;startLevel(li,d,hk);break}
    case 'wave':callWave();break;
    case 'desel':G.sel=null;G.spot=null;G.prev=null;renderPanel();break;
    case 'prev':{const k=b.dataset.k;if(G.prev===k&&G.spot&&canPlace(G.spot.x,G.spot.y))doBuild();else{G.prev=k;sfx('tap');renderPanel()}break}
    case 'build':doBuild();break;
    case 'upgrade':if(G.sel&&!G.sel.hero&&upgrade(G.sel,b.dataset.p))renderPanel();break;
    case 'heroAb':heroAbility();break;
    case 'sell':if(G.sel&&!G.sel.hero){sell(G.sel);G.sel=null;renderPanel()}break;
    case 'mode':{const m=['first','last','strong','close'];G.sel.mode=m[(m.indexOf(G.sel.mode)+1)%4];renderPanel();saveIfQuiet();break}
    case 'spell':{const k=b.dataset.spell;if(k==='nova'){castNova()}else{G.spell=G.spell===k?null:k;G.sel=null;G.spot=null;renderPanel()}break}
  }
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(G&&!G.over&&!G.paused)showPause();musicStop()}
  else if(P.music&&AC){musicStart(G?G.L.b:'menu');if(G&&(G.paused||G.over))musicDuck(true)}});
addEventListener('resize',()=>{if(G){layout();renderPanel()}});
if(window.ResizeObserver)new ResizeObserver(()=>{if(G)layout()}).observe($('#boardWrap'));

/* ---------- Titel-Animation ---------- */
const tcv=$('#titleCv'),tctx=tcv.getContext('2d');let tParts=[];
function drawTitle(t){
  if($('#scrTitle').hidden)return;const r=tcv.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
  if(tcv.width!==Math.round(r.width*dpr)||tcv.height!==Math.round(r.height*dpr)){tcv.width=Math.round(r.width*dpr);tcv.height=Math.round(r.height*dpr)}
  const c=tctx,w=r.width,h=r.height;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  if(tParts.length<40)tParts.push({x:Math.random()*w,y:h+10,v:R(10,30),s:R(1,3),a:R(.2,.7)});
  for(const p of tParts){p.y-=p.v/60;c.fillStyle=`rgba(255,201,74,${p.a})`;c.beginPath();c.arc(p.x+Math.sin(t/1000+p.x)*8,p.y,p.s,0,TAU);c.fill()}
  tParts=tParts.filter(p=>p.y>-10);
  const LS=w>h,AW=LS?w*.6:w,s=LS?Math.min(h/4.8,AW/4.4,120):Math.min(w/4.4,112,h/7.5),gy=LS?h*.4:h*.36,py=gy+s*.95,T=t/1000;
  for(let i=0;i<4;i++){const cw=s*(.7+.15*i),cx=((T*(10+i*6)+i*w*.37)%(w+cw*3))-cw*1.5,cy=h*(.17+i*.06)+(LS?0:h*.05);c.beginPath();for(const [ox2,oy2,rr3] of [[0,0,.5],[.45,.08,.38],[-.45,.1,.35],[.15,-.25,.36]]){c.moveTo(cx+ox2*cw+rr3*cw,cy+oy2*cw);c.arc(cx+ox2*cw,cy+oy2*cw,rr3*cw,0,TAU)}c.strokeStyle=OL;c.lineWidth=5;c.stroke();c.fillStyle='#ffffff';c.fill();c.fillStyle='rgba(180,215,255,.6)';c.beginPath();c.ellipse(cx,cy+cw*.25,cw*.6,cw*.12,0,0,TAU);c.fill()}
  c.fillStyle='#5cbd4f';c.strokeStyle=OL;c.lineWidth=4;c.beginPath();c.moveTo(0,gy-s*.2);for(let x=0;x<=w;x+=16)c.lineTo(x,gy-s*.2+Math.sin(x*.01+1)*18);c.lineTo(w,h);c.lineTo(0,h);c.fill();c.stroke();
  c.strokeStyle=OL;c.lineWidth=s*.62;c.lineCap='round';c.beginPath();c.moveTo(-s,py);c.bezierCurveTo(w*.3,py-s*.3,w*.6,py+s*.4,w+s,py);c.stroke();
  c.strokeStyle='#a8793f';c.lineWidth=s*.56;c.stroke();c.strokeStyle='#ddb070';c.lineWidth=s*.46;c.stroke();
  const fe=(k,off,sz)=>{const u=((T*.08+off)%1.2)-.1,x=u*w,y=py+Math.sin(u*Math.PI*1.4)*s*.02-s*.08;const ang=0;const e={def:EN[k],t:k,x:x/(sz),y:y/(sz),ang,ph:off*9,hp:1,max:1,sh:EN[k].shield?1:0,msh:EN[k].shield?1:0,air:!!EN[k].air,hit:0,slow:0,frz:0};drawEnemy(c,e,sz,T)};
  fe('run',0,s*.9);fe('tank',.25,s*.9);fe('fast',.5,s*.9);fe('flyer',.7,s*.9);fe('run',.9,s*.9);
  c.save();drawTower(c,AW*.24,gy+s*.05,s,'cannon',2,-Math.PI/2+Math.sin(T*1.1)*.6,0,T);drawTower(c,AW*.76,gy+s*.12,s,'tesla',3,0,0,T);drawTower(c,AW*.5,py+s*.95,s*.85,'archer',1,-Math.PI/2-Math.sin(T*1.4)*.5,0,T);drawTower(c,AW*.15,py+s*1.1,s*.75,'frost',1,0,0,T);drawTower(c,AW*.86,py+s*1.05,s*.75,'missile',2,-Math.PI/2,0,T);c.restore()
}

/* ---------- Schleife ---------- */
let last=performance.now();
function loop(now){
  const raw=Math.min(.05,(now-last)/1000);last=now;
  if(G&&!G.paused&&!G.over){let left=raw*G.speed;while(left>0){const d=Math.min(1/60,left);update(d);left-=d;if(!G||G.over)break}}
  else if(G&&G.over){for(const p of G.pa){p.x+=p.vx*raw;p.y+=p.vy*raw;p.l-=raw}G.pa=G.pa.filter(p=>p.l>0)}
  if(G){draw();tickHud()}else drawTitle(now);
  requestAnimationFrame(loop)
}
window.__TD={get G(){return G},waveDef,hpMul,startLevel,update,build,upgrade,sell,callWave,st,hst,TW,EN,HERO,DIFF,LEVELS,EI,P,endGame,transpose,canPlace,placeHero,heroAbility,saveRun,loadRun,clearRun,canUp,upCost,tCost,get COLS(){return COLS},get ROWS(){return ROWS}};
renderTitle();requestAnimationFrame(loop);
})();
